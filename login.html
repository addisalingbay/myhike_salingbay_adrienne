<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login or create a MyHikes account.">

    <title>Login / Sign Up | MyHikes</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!-- Navbar -->
    <site-navbar></site-navbar>

    <!-- Main content -->
    <main>
        <div class="container py-5" style="max-width: 420px;">
            <!-- Alerts -->
            <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

            <!-- Login -->
            <div id="loginView">
                <h3 class="mb-3 text-center">Login</h3>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label visually-hidden">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            class="form-control"
                            placeholder="Email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword" class="form-label visually-hidden">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

                <small class="d-block mt-3 text-center">
                    Don’t have an account?
                    <a href="#" id="toSignup">Sign up</a>
                </small>
            </div>

            <!-- Signup -->
            <div id="signupView" class="d-none">
                <h3 class="mb-3 text-center">Sign Up</h3>

                <form id="signupForm" novalidate>
                    <div class="mb-3">
                        <label for="signupName" class="form-label visually-hidden">Full name</label>
                        <input
                            type="text"
                            id="signupName"
                            class="form-control"
                            placeholder="First and Last Name"
                            autocomplete="name"
                            aria-label="Full name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="signupEmail" class="form-label visually-hidden">Email</label>
                        <input
                            type="email"
                            id="signupEmail"
                            class="form-control"
                            placeholder="Email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="signupPassword" class="form-label visually-hidden">Password</label>
                        <input
                            type="password"
                            id="signupPassword"
                            class="form-control"
                            placeholder="Password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Create Account
                    </button>
                </form>

                <small class="d-block mt-3 text-center">
                    Already have an account?
                    <a href="#" id="toLogin">Login</a>
                </small>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Firebase and authentication-related scripts -->
    <!-- The order of loading matters -->
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/loginSignup.js"></script>
    <script type="module" src="/src/app.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

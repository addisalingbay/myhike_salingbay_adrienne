<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MyHikes - Join a community of hikers looking for new places to explore.">

    <title>MyHikes | My BCIT Project</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!-- Navbar -->
    <site-navbar></site-navbar>

    <!-- Main content -->
    <main>
        <div class="container" data-bs-theme="dark">
            <div class="px-4 py-5 my-5 text-center">
                <img
                    class="d-block mx-auto mb-4"
                    src="/images/star.png"
                    alt="MyHikes logo"
                    width="72"
                    height="57"
                >

                <h1 class="display-5 fw-bold">
                    Welcome to MyHikes,
                    <br>
                    <span id="name-goes-here">Adrienne!</span>
                </h1>

                <div class="col-lg-6 mx-auto">
                    <p class="lead mb-4">
                        Join a community of hikers looking for new places to explore.
                    </p>

                    <h2>The view is better, together.</h2>

                    <div class="d-grid justify-content-sm-center">
                        <a
                            href="/login.html"
                            class="btn btn-info btn-lg"
                            role="button"
                        >
                            Login / Sign Up
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- App JavaScript -->
    <script type="module" src="/src/app.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
